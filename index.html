         (src/lib/usePageMeta.ts) for JS-executing crawlers and social clients. -->
    <meta
      name="description"
      content="Portfolio of Sehaz Nagpal, a UI-UX designer intrigued by why people do what they do. Case studies on the MoolRoop app, the Dr Cuterus website, and a behavioural-economics dissertation on payment fraud."
    />
    <meta property="og:title" content="Sehaz Nagpal | UI/UX Designer Portfolio" />

      property="og:description"
      content="Portfolio of Sehaz Nagpal, a UI-UX designer intrigued by why people do what they do. Case studies on the MoolRoop app, the Dr Cuterus website, and a behavioural-economics dissertation on payment fraud."
    />
    <meta property="og:image" content="/og-image.jpg" />
